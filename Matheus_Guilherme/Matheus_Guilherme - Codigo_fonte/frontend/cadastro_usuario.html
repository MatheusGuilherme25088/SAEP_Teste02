<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Menu principal -->
    <header class="topo">
        <h1>Gerenciamento de Tarefas</h1>
        <nav>
            <a href="cadastro_usuario.html">Cadastro de Usuários</a>
            <a href="cadastro_tarefa.html">Cadastro de Tarefas</a>
            <a href="index.html">Gerenciar Tarefas</a>
        </nav>
    </header>

    <main class="conteudo">
        <h2>Cadastro de Usuários</h2>

        <form id="form-usuario" class="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" maxlength="100" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" maxlength="100" required>

            <button type="submit" class="botao">Cadastrar</button>
        </form>
    </main>

    <script src="js/cadastro_usuario.js"></script>
</body>
</html>
